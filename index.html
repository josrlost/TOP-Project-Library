<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script/script.js" defer></script>
    <title>TOP Project: Library</title>
</head>
<header>
    <h1>Reading List</h1>
</header>
<body>
    <div class="container">
        <div>
            <button id="addNewBookBtn" type="button">Add Book</button>
        </div>
        <div class="bookInfo">
            <table class="bookTable">
                <tr>
                    <th></th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Language</th>
                    <th>Number of Pages</th>
                    <th>Read</th>
                    <th></th>
                </tr>
            </table>
        </div>
        <dialog id="dialog">
            <form id="submitBookForm">
                <fieldset>
                    <legend>Book Information</legend>
                    <label for="title">Book Title</label>
                    <input type="text" id="title" placeholder="Book Title" required>
                    <label for="author">Book Author</label>
                    <input type="text" id="author" placeholder="Book Author" required>
                    <label for="pages">Number of pages</label>
                    <input type="text" id="pages" placeholder="100 pages" required>
                    <label for="language">Language</label>
                    <input type="text" id="language" placeholder="English" required>
                </fieldset>
                <fieldset>
                    <legend>Have you read the book?</legend>
                    <div>
                        <label for="hasRead">Yes</label>
                        <input type="radio" id="hasRead" required value="Yes" name="hasRead">
                    </div>
                    <div>
                        <label for="hasNotRead">No</label>
                        <input type="radio" id="hasNotRead" required value="No" name="hasRead">
                    </div>
                </fieldset>
                <div id="btnDiv">
                    <button id="closeBtn" type="button">Close dialog</button>
                    <button id="submitInfoBtn" type="submit">Submit</button>
                </div>
            </form>
        </dialog>
    </div>
</body>
</html>
