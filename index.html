<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script/script.js" defer></script>
    <title>TOP Project: Library</title>
</head>
<body>
    <div class="container">
        <div>
            <button id="addNewBookBtn" type="button">Add Book</button>
        </div>
        <div class="bookInfo">
            <table class="bookTable">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Language</th>
                    <th>Number of Pages</th>
                    <th>Read</th>
                </tr>
            </table>
        </div>
        <dialog id="dialog">
            <form id="submitBookForm">
                <label for="title">Book Title</label>
                <input type="text" id="title" placeholder="Book Title">
                <label for="author">Book Author</label>
                <input type="text" id="author" placeholder="Book Author">
                <label for="pages">Number of pages</label>
                <input type="text" id="pages" placeholder="100 pages">
                <label for="language">Language</label>
                <input type="text" id="language" placeholder="English">
                <label for="hasRead">Have you read it?</label>
                <input type="text" id="hasRead" placeholder="Yes">
            </form>
            <div id="btnDiv">
                <button id="closeBtn" type="button">Close dialog</button>
                <button id="submitInfoBtn" type="submit">Submit</button>
            </div>
        </dialog>
    </div>
</body>
</html>
