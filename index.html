<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script/script.js" defer></script>
    <title>TOP Project: Library</title>
</head>
<body>
    <div class="container">
        <div>
            <button id="addNewBookBtn" type="button">Add Book</button>
        </div>
        <div class="bookInfo">
            <table class="bookTable">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Language</th>
                    <th>Number of Pages</th>
                </tr>
            </table>
        </div>
        <dialog id="dialog">
            <button id="closeBtn" type="button">Close dialog</button>
        </dialog>
    </div>
</body>
</html>
